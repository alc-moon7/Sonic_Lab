name: sonic_lab
description: Production Flutter app for water ejection and dust removal using calibrated audio tones.
publish_to: 'none'

version: 2.4.0+24

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  device_info_plus: ^10.0.0
  flutter_animate: ^4.5.0
  flutter_riverpod: ^2.5.0
  flutter_soloud: ^2.0.0
  flutter_svg: ^2.0.0
  go_router: ^14.0.0
  google_fonts: ^6.2.0
  just_audio: ^0.9.40
  package_info_plus: ^8.0.0
  permission_handler: ^11.3.0
  riverpod_annotation: ^2.3.0
  shared_preferences: ^2.3.0
  system_info2: ^4.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
